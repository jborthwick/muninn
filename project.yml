name: muninn
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true

packages:
  FeedKit:
    url: https://github.com/nmdias/FeedKit
    from: "9.1.2"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.3.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R58AJ79B3J

# Two editions share one codebase:
#   Muninn      — the pared-back app for TestFlight / App Store. Leaves out the
#                 Fandom wiki insight sources entirely; Edition.swift switches off
#                 auto-processing, AI chapters, pause recap, and debug tools.
#   MuninnLabs  — everything, built with the MUNINN_LABS compilation condition.
#                 Keeps the original bundle ID so the existing install and its
#                 data carry over.
targetTemplates:
  MuninnApp:
    type: application
    platform: iOS
    dependencies:
      - package: FeedKit
      - package: Kingfisher
    settings:
      base:
        INFOPLIST_FILE: Muninn/Info.plist
        CODE_SIGN_ENTITLEMENTS: Muninn/Muninn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Muninn/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.personal.muninn.refresh
          - com.personal.muninn.processing
          - com.personal.muninn.prepare.*
        NSSpeechRecognitionUsageDescription: Muninn uses on-device speech recognition to generate transcripts for downloaded episodes. Audio is processed entirely on your device and never sent anywhere.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: $(APP_DISPLAY_NAME)

targets:
  Muninn:
    templates:
      - MuninnApp
    sources:
      - path: Muninn
        excludes:
          - Services/Insight
          - Views/Insight
          - Views/Player/NowPlayingInsightView.swift
          - Models/EpisodeInsight.swift
    settings:
      base:
        # Placeholder — replace with your own reverse-DNS ID before submitting.
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.muninn.app
        APP_DISPLAY_NAME: Muninn

  MuninnLabs:
    templates:
      - MuninnApp
    sources:
      - Muninn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.muninn
        APP_DISPLAY_NAME: Muninn Labs
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MUNINN_LABS

schemes:
  Muninn:
    build:
      targets:
        Muninn: all
    run:
      config: Debug
  MuninnLabs:
    build:
      targets:
        MuninnLabs: all
    run:
      config: Debug
