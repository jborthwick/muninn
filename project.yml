name: muninn
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true

packages:
  FeedKit:
    url: https://github.com/nmdias/FeedKit
    from: "9.1.2"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.3.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R58AJ79B3J

targets:
  Muninn:
    type: application
    platform: iOS
    sources:
      - Muninn
    dependencies:
      - package: FeedKit
      - package: Kingfisher
    settings:
      base:
        INFOPLIST_FILE: Muninn/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.muninn
        CODE_SIGN_ENTITLEMENTS: Muninn/Muninn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Muninn/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.personal.muninn.refresh
          - com.personal.muninn.processing
          - com.personal.muninn.prepare.*
        NSSpeechRecognitionUsageDescription: Muninn uses on-device speech recognition to generate transcripts for downloaded episodes. Audio is processed entirely on your device and never sent anywhere.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Muninn

schemes:
  Muninn:
    build:
      targets:
        Muninn: all
    run:
      config: Debug
